<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Що ШІ вже може зробити?</title><style>
:root{--ink:#162044;--blue:#3478eb;--cyan:#6bd5e5;--lime:#aaf563;--orange:#ff922e;--purple:#8060d3;--pink:#ffdbe4}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:Arial,sans-serif}main{max-width:1100px;margin:auto;padding:32px 22px 70px}h1{font-size:clamp(29px,4vw,48px);margin:0 0 12px;color:#161616}h2{font-size:26px}p{line-height:1.55}.lead{font-size:18px;color:#42506d;max-width:830px}.eyebrow{font-weight:800;color:var(--blue);letter-spacing:.07em;font-size:13px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:34px}.tile{min-height:142px;border:0;border-radius:19px;cursor:pointer;font-size:23px;font-weight:800;color:#141414;padding:16px;transition:transform .15s,box-shadow .15s;text-align:center}.tile:hover,.tile:focus-visible{transform:translateY(-4px);box-shadow:0 9px 24px #18264b24;outline:3px solid #1e326d}.tile span{display:block;font-size:13px;margin-top:10px;font-weight:500}.c0,.c4{background:var(--cyan)}.c1,.c5{background:var(--lime)}.c2,.c6{background:var(--orange)}.c3,.c7{background:var(--purple)}.c3,.c7{color:white}.note{margin-top:34px;color:var(--blue);font-size:25px;font-weight:800;text-align:center}.back{background:#eef3ff;border:0;border-radius:10px;padding:12px 18px;color:var(--blue);font-weight:700;cursor:pointer}.panel{background:#f3f6fb;border-radius:18px;padding:23px;margin:20px 0}.result{border-left:7px solid var(--lime);background:#f8fbf3;border-radius:12px;padding:22px;margin:20px 0}.prompt{white-space:pre-wrap;font-size:16px}.artifact{background:white;border:1px solid #dce3ef;border-radius:12px;padding:20px;overflow:auto}.artifact pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;font-size:14px}.questions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.question{background:#f4f0ff;border-radius:12px;padding:18px;font-weight:700}.answer{display:block;width:100%;margin-top:12px;border:1px solid #aab9d2;border-radius:8px;padding:10px;font:inherit;min-height:90px;resize:vertical;font-weight:400}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}.btn{background:var(--blue);color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.muted{color:#5d6680}.tag{display:inline-block;background:#e7f0ff;border-radius:99px;padding:6px 12px;color:#2e65c6;font-weight:700;font-size:13px}footer{margin-top:50px;font-size:13px;color:#67718b}a{color:var(--blue)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.questions{grid-template-columns:1fr}}@media(max-width:480px){.grid{gap:12px}.tile{min-height:115px;font-size:19px}main{padding:24px 15px}.note{font-size:20px}}</style></head><body><main id="app"></main><script>
const tasks=[
{title:'Вебзастосунок',prompt:'Ти — full-stack розробник. Створи прототип вебзастосунку для реєстрації учасників шкільних заходів. Передбач список заходів, форму реєстрації, перевірку даних, обмеження місць і повідомлення про результат. Використай HTML, CSS та JavaScript без бібліотек. Опиши архітектуру, надай код файлів і поясни, що потребує сервера.',intro:'ШІ може створити робочий інтерфейс прототипу, але локальна демонстрація не є готовим захищеним сервісом.',html:`<div style="border:1px solid #ccd9ed;padding:18px;border-radius:12px;max-width:520px"><h3>Реєстрація на шкільний захід</h3><label>Захід <select id="event" style="padding:8px;width:100%;margin:8px 0"><option>STEM-фестиваль (3 місця)</option><option>ІТ-хакатон (0 місць)</option></select></label><label>Ім’я <input id="person" style="padding:8px;width:100%;margin:8px 0" placeholder="Ваше ім’я"></label><button onclick="demoRegister()" class="btn">Зареєструватися</button><p id="msg" role="status"></p></div>`,code:'Демонстрація: HTML-форма + JavaScript-перевірка. Дані не передаються на сервер і не зберігаються.'},
{title:'База даних',prompt:'Ти — проєктувальник баз даних. Для вебсервісу реєстрації на шкільні заходи спроєктуй реляційну базу даних із таблицями заходів, учасників і реєстрацій. Вкажи ключі та обмеження, створи SQL для PostgreSQL, тестові дані й три запити. Поясни рішення.',intro:'ШІ пропонує схему й SQL, але команда має перевірити зв’язки, типи та обмеження.',code:`CREATE TABLE events (\n  id SERIAL PRIMARY KEY,\n  title TEXT NOT NULL,\n  capacity INTEGER NOT NULL CHECK (capacity > 0)\n);\nCREATE TABLE participants (\n  id SERIAL PRIMARY KEY,\n  email TEXT NOT NULL UNIQUE\n);\nCREATE TABLE registrations (\n  event_id INTEGER REFERENCES events(id),\n  participant_id INTEGER REFERENCES participants(id),\n  PRIMARY KEY(event_id, participant_id)\n);\n\n-- Питання: чи гарантує ця схема,\n-- що кількість реєстрацій не перевищить capacity?`},
{title:'API',prompt:'Ти — backend-розробник. Спроєктуй REST API для сервісу реєстрації на шкільні заходи: список заходів, деталі, реєстрація, скасування та перегляд учасників організатором. Запропонуй маршрути, методи, JSON, статус-коди й обробку помилок. Покажи мінімальний приклад FastAPI та ризики безпеки.',intro:'ШІ швидко складає API-контракт. Реальне розмежування доступу та конкурентні запити треба перевіряти окремо.',code:`GET    /events\nGET    /events/{id}\nPOST   /events/{id}/registrations\nDELETE /events/{id}/registrations/{participant_id}\nGET    /events/{id}/participants   [лише організатор]\n\nПриклад запиту:\nPOST /events/12/registrations\n{ "participant_id": 41 }\n\nПриклад відповіді:\n201 Created\n{ "registration_id": 106, "status": "confirmed" }\n\nПитання: хто перевіряє право на перегляд учасників?`},
{title:'Dataset',prompt:'Ти — аналітик даних. Створи синтетичний CSV-набір про 150 реєстрацій на шкільні заходи. Додай 10 навмисних проблем якості даних: пропуски, дублікати, суперечності та помилкові дати. Запропонуй pandas-код очищення і поясни, що не можна виправляти автоматично. Не використовуй реальні персональні дані.',intro:'ШІ може створити синтетичні дані, але їхню правдоподібність і правила очищення визначає людина.',code:`event_id,event_type,event_date,capacity,status\n12,STEM,2026-11-12,30,confirmed\n12,STEM,2026-11-12,30,confirmed\n13,IT,2026-12-01,0,confirmed\n14,Science,2026-10-31,25,\n15,Design,wrong-date,20,cancelled\n\nПроблеми для пошуку:\n• дублікати — але чи точно це одна реєстрація?\n• capacity = 0 для підтвердженої участі\n• пропущений статус\n• некоректна дата`},
{title:'UI',prompt:'Ти — UX/UI-дизайнер. Спроєктуй мобільний інтерфейс реєстрації на шкільні заходи. Передбач навігацію, доступні підписи, помилки форми, підтвердження й відсутність місць. Опиши користувацький сценарій, створи HTML/CSS-прототип і запропонуй перевірку доступності.',intro:'ШІ генерує ескіз екрана. Зручність для реальних користувачів треба перевіряти тестуванням.',html:`<div style="max-width:340px;margin:auto;border:8px solid #26345e;border-radius:28px;padding:20px;background:#f7fbff"><small>ШКІЛЬНІ ПОДІЇ</small><h3>Оберіть захід</h3><div style="background:#dff4f8;padding:15px;border-radius:10px;margin:8px 0"><b>STEM-фестиваль</b><p>12 листопада · Є місця</p><button class="btn" style="width:100%">Обрати</button></div><div style="background:#f1eafb;padding:15px;border-radius:10px"><b>ІТ-хакатон</b><p>18 листопада · Місць немає</p><button class="btn" disabled style="background:#aaa;width:100%">Недоступно</button></div></div>`,code:'Питання: як користувач із клавіатурою або скрінридером взаємодіятиме з інтерфейсом?'},
{title:'Код',prompt:'Ти — JavaScript-розробник. Створи модуль клієнтської перевірки форми реєстрації: ім’я, email, захід, згода. Перевір обов’язкові поля, формат email, покажи помилки поруч із полями та заблокуй повторне надсилання. Без фреймворків. Поясни, чому перевірка на сервері також обов’язкова.',intro:'ШІ пише фрагмент коду. Учень має пояснити його поведінку на граничних випадках.',code:`function validate(data) {\n  const errors = {};\n  if (!data.name.trim()) errors.name = 'Вкажіть ім’я';\n  if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(data.email)) {\n    errors.email = 'Некоректна адреса';\n  }\n  if (!data.eventId) errors.eventId = 'Оберіть захід';\n  if (!data.consent) errors.consent = 'Потрібна згода';\n  return errors;\n}\n\n// Питання: що станеться, якщо користувач\n// обійде перевірку в браузері?`},
{title:'Тестування',prompt:'Ти — QA-інженер. Склади щонайменше 15 тест-кейсів для сервісу реєстрації: позитивні, негативні, граничні й безпекові. Для кожного наведи передумову, кроки, дані та очікуваний результат. Додай одночасну реєстрацію двох людей на останнє місце. Не стверджуй, що тести виконані.',intro:'ШІ швидко створює тест-план, але це ще не докази, що продукт працює.',html:`<table style="border-collapse:collapse;width:100%;font-size:14px"><tr style="background:#dfe9ff"><th style="padding:10px">Тест</th><th>Вхідні умови</th><th>Очікувано</th></tr><tr><td style="padding:10px">T01</td><td>Коректна форма, місця є</td><td>Реєстрацію створено</td></tr><tr><td style="padding:10px">T02</td><td>Порожній email</td><td>Повідомлення про помилку</td></tr><tr><td style="padding:10px">T03</td><td>Дві заявки на останнє місце</td><td>Лише одна підтверджена</td></tr><tr><td style="padding:10px">T04</td><td>Неавторизований запит списку</td><td>Доступ заборонено</td></tr></table>`,code:'Це приклади тест-кейсів, а не результати їх виконання.'},
{title:'Документація',prompt:'Ти — технічний письменник. Створи README.md для навчального сервісу реєстрації на шкільні заходи: призначення, користувачі, функції, технології, файли, встановлення, запуск, тестування, обмеження, захист даних, подальший розвиток. Не вигадуй реалізованих функцій; познач невідоме. Додай інструкції для учня та організатора.',intro:'ШІ формує структуру README. Учень повинен звірити кожне твердження з реальним проєктом.',code:`# Реєстрація на шкільні заходи\n\n## Призначення\nНавчальний прототип для реєстрації учасників.\n\n## Функції\n- Перегляд заходів — [підтвердити реалізацію]\n- Реєстрація — [підтвердити реалізацію]\n- Кабінет організатора — [ще не реалізовано?]\n\n## Запуск\n[Уточнити залежності й команду запуску]\n\n## Обмеження\nНе використовувати з реальними персональними\nданими без перевірки безпеки.\n\n## Тестування\n[Додати посилання на виконані тести]`}
];
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){app.innerHTML=`<div class="eyebrow">ПРАКТИКА ДЛЯ КОМАНД · ШІ В ІНФОРМАТИЦІ</div><h1>А що із завданнями учня?</h1><p class="lead">Один проєкт — вісім різних завдань для ШІ. Оберіть напрям, перегляньте промпт і демонстраційний результат. Визначте, що все одно має зробити учень.</p><div class="grid">${tasks.map((t,i)=>`<button class="tile c${i}" onclick="openTask(${i})">${esc(t.title)}<span>Переглянути результат →</span></button>`).join('')}</div><div class="note">ЩО З ЦЬОГО ВЖЕ ЛЕГКО ЗРОБИТЬ ШІ?</div><footer>Демонстраційні приклади. Не є підтвердженням виконання або тестування реального програмного продукту.</footer>`}
function openTask(i){const t=tasks[i];history.replaceState(null,'','#task-'+(i+1));app.innerHTML=`<button class="back" onclick="goHome()">← Усі завдання</button><p class="eyebrow" style="margin-top:25px">ЗАВДАННЯ ${i+1} / 8</p><h1>${esc(t.title)}</h1><span class="tag">Промпт → приклад результату → експертиза</span><section class="panel"><h2>Якісний промпт</h2><p class="prompt">${esc(t.prompt)}</p></section><section class="result"><h2>Приклад результату ШІ</h2><p>${esc(t.intro)}</p><div class="artifact">${t.html||'<pre>'+esc(t.code)+'</pre>'}${t.html&&t.code?'<p class="muted">'+esc(t.code)+'</p>':''}</div><p class="muted"><b>Увага:</b> це спеціально підготовлений демонстраційний результат, а не відповідь реального сервісу ШІ та не підтвердження виконаних тестів.</p></section><h2>Командна експертиза</h2><div class="questions"><label class="question">Що ШІ зробив?<textarea class="answer" placeholder="Висновок команди"></textarea></label><label class="question">Що потрібно перевірити?<textarea class="answer" placeholder="Ризики, помилки, обмеження"></textarea></label><label class="question">Що має зробити учень?<textarea class="answer" placeholder="Власний внесок і докази"></textarea></label></div><div class="actions"><button class="btn" onclick="downloadAnswers(${i})">Зберегти висновок команди (.txt)</button><button class="back" onclick="openTask(${(i+1)%8})">Наступне завдання →</button></div>`;window.scrollTo(0,0)}
function downloadAnswers(i){let fields=[...document.querySelectorAll('.answer')].map(x=>x.value);let s=`Завдання: ${tasks[i].title}\n\nЩо ШІ зробив?\n${fields[0]}\n\nЩо перевірити?\n${fields[1]}\n\nЩо робить учень?\n${fields[2]}\n`;let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/plain;charset=utf-8'}));a.download='Висновок_команди_'+(i+1)+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function demoRegister(){let name=document.getElementById('person').value.trim(),event=document.getElementById('event').selectedIndex;document.getElementById('msg').textContent=!name?'Введіть ім’я':event===1?'На цей захід місць немає':`Демонстрація: ${name}, форму перевірено. Реальної реєстрації немає.`}
function goHome(){history.replaceState(null,'',location.pathname);home();window.scrollTo(0,0)}
const match=location.hash.match(/^#task-(\d+)$/);match&&Number(match[1])>=1&&Number(match[1])<=8?openTask(Number(match[1])-1):home();
</script></body></html>
